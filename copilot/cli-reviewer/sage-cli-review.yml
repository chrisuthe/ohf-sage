name: OHF Sage review (Copilot CLI)

# Runs the native Sage reviewer architecture on GitHub Copilot's models (billed to your
# Copilot subscription, not the Anthropic API): a full-attention agent that greps the mined
# review corpus and cites the leads' real PR discussions. Advisory — comments only, never a gate.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  sage-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Verify the exact package/command against the current Copilot CLI docs if this changes.
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Resolve PR number
        id: pr
        run: echo "num=${{ github.event.pull_request.number || github.event.inputs.pr }}" >> "$GITHUB_OUTPUT"

      - name: Fetch Sage agent + corpus from the ohf-sage Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo chrisuthe/ohf-sage --pattern ohf-sage.md --output ohf-sage.md --clobber
          gh release download --repo chrisuthe/ohf-sage --pattern ohf-sage-corpus.jsonl --output ohf-sage-corpus.jsonl --clobber

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff "${{ steps.pr.outputs.num }}" --repo "${{ github.repository }}" > pr.diff

      - name: Sage review via Copilot CLI
        env:
          # A PAT (or org token) belonging to a Copilot-LICENSED identity — the default
          # Actions GITHUB_TOKEN does not carry Copilot entitlement.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Set repo/org variable SAGE_MODEL to the exact Claude model id your CLI offers
          # (run `copilot` then `/model` to list; e.g. claude-opus-5 if available).
          SAGE_MODEL: ${{ vars.SAGE_MODEL || 'claude-opus-4.8' }}
        run: |
          cat > prompt.txt <<'EOF'
          You are the OHF Sage reviewer. Read ./ohf-sage.md for your full instructions and cited
          principles, then review the pull-request diff in ./pr.diff. Walk the WHOLE diff. When a
          principle does not cover something you see, grep ./ohf-sage-corpus.jsonl (case-insensitive
          keyword alternation) for a real precedent and cite its html_url. Output ONLY a JSON array
          of findings; each element:
          {"severity":"CRITICAL|PROBLEM|SUGGESTION","path":"file/path","line":<int or null>,"issue":"1-2 sentences","principle":"governing principle","citation_url":"source permalink"}
          No prose outside the JSON array. Never invent a rule or citation.
          EOF
          copilot -p "$(cat prompt.txt)" -s --model "$SAGE_MODEL" \
            --allow-tool 'shell(grep:*)' --allow-tool 'shell(cat:*)' --allow-tool 'read' \
            --no-ask-user | tee findings.json

      - name: Post review to the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.num }}
        run: python .github/scripts/sage_post_review.py findings.json
